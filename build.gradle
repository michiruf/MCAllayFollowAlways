plugins {
    id 'java'
    // Minecraft is unobfuscated since 26.1, which requires the non-remapping loom plugin variant
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.19-SNAPSHOT' apply false
}

// Get version from Stonecutter instead of project property
def minecraftVersion = stonecutter.current.version
boolean obfuscated = stonecutter.eval(minecraftVersion, '<26.1')
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

apply from: rootProject.file('build.allprojects.gradle')
apply from: rootProject.file('build.versions.gradle')

// Disabled, because these configurations would not work anyways. Kept for not going this way again
//loom {
//    runConfigs.configureEach {
//        ideConfigGenerated = stonecutter.current.isActive
//        runDir = "../../run"
//    }
//}

def minecraftVersionDefinition = ext.minecraftVersionDefinitions[minecraftVersion]
int targetJavaVersion = (int) minecraftVersionDefinition['java']
base.archivesName = rootProject.name
project.version = "${project.version}+${minecraftVersion}"

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "${rootProject.name}-test"
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}

dependencies {
    // Minecraft and fabric
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (obfuscated) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${minecraftVersionDefinition['fabric']}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${minecraftVersionDefinition['fabricApi']}"
    } else {
        implementation "net.fabricmc:fabric-loader:${minecraftVersionDefinition['fabric']}"
        implementation "net.fabricmc.fabric-api:fabric-api:${minecraftVersionDefinition['fabricApi']}"
    }

    // Tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
    testImplementation "net.fabricmc:fabric-loader-junit:${minecraftVersionDefinition['fabric']}"
}

processResources {
    var replaceProperties = [
            version  : project.version,
            minecraft: minecraftVersion,
            fabric   : minecraftVersionDefinition['fabric'],
            fabricApi: minecraftVersionDefinition['fabricApi'],
            // Fabric API dropped its 'fabric' mod id alias with 26.1, but versions for 1.19 - 1.19.1 do only know 'fabric'
            fabricApiModId: stonecutter.eval(minecraftVersion, '>=26.1') ? 'fabric-api' : 'fabric'
    ]
    inputs.properties replaceProperties
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    // Enforce the specified java version
    it.sourceCompatibility = targetJavaVersion
    it.targetCompatibility = targetJavaVersion

    // Ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    // Enforce the specified java version
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)

    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

test {
    useJUnitPlatform()
    maxHeapSize = '1G'
    testLogging {
        events 'passed'
    }
}

// Produces the distributable jar, regardless of whether the version needs remapping or not
tasks.register('releaseJar') {
    dependsOn obfuscated ? 'remapJar' : 'jar'
}
